        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);
            text-align: center;
            padding: var(--space-xl);
            position: relative;
            overflow: hidden;
        }

        .error-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(200, 166, 94, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 30%, rgba(200, 166, 94, 0.03) 0%, transparent 50%);
        }

        .error-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .error-code {
            font-family: var(--font-en);
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--color-accent-dark), var(--color-accent-light), #f0d48a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--space-lg);
        }

        .error-title {
            color: var(--color-white);
            font-family: var(--font-heading-ja);
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            margin-bottom: var(--space-lg);
            line-height: 1.6;
        }

        .error-illustration {
            font-size: 4rem;
            margin-bottom: var(--space-lg);
            display: flex;
            gap: var(--space-md);
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-illustration span {
            display: inline-block;
            animation: scatter 3s ease-in-out infinite;
        }

        .error-illustration span:nth-child(1) {
            animation-delay: 0s;
        }

        .error-illustration span:nth-child(2) {
            animation-delay: 0.3s;
            transform: rotate(15deg);
        }

        .error-illustration span:nth-child(3) {
            animation-delay: 0.6s;
            transform: rotate(-10deg);
        }

        .error-illustration span:nth-child(4) {
            animation-delay: 0.9s;
            transform: rotate(25deg);
        }

        .error-illustration span:nth-child(5) {
            animation-delay: 1.2s;
            transform: rotate(-20deg);
        }

        @keyframes scatter {

            0%,
            100% {
                transform: translateY(0) rotate(var(--r, 0deg));
            }

            50% {
                transform: translateY(-8px) rotate(var(--r, 0deg));
            }
        }

        .error-message {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            line-height: 1.9;
            margin-bottom: var(--space-xl);
            padding: var(--space-lg);
            border: 1px solid rgba(200, 166, 94, 0.15);
            background: rgba(255, 255, 255, 0.03);
        }

        .error-message em {
            color: var(--color-accent);
            font-style: normal;
        }

        .error-actions {
            display: flex;
            gap: var(--space-md);
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-footer {
            position: absolute;
            bottom: var(--space-lg);
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            font-family: var(--font-en);
            letter-spacing: 0.1em;
        }
    </style>
